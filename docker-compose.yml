services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: gis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "gisuser"
      POSTGRES_PASSWORD: "Fefewgg444fk"
      POSTGRES_DB: "student_gis_db"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gisuser -d student_gis_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gis-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gis-backend
    restart: unless-stopped
    environment:
      - "NODE_ENV=production"
      - "DATABASE_URL=postgresql://gisuser:Fefewgg444fk@postgres:5432/student_gis_db"
      - "YANDEX_MAPS_API_KEY=8ea7d884-6708-4459-8032-556d2eb89a65"
      - "JWT_SECRET=your_secret_min_32_chars"
      - "CORS_ORIGIN=http://localhost:3000,https://student-gis.ru"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gis-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gis-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - gis-network

  nginx:
    image: nginx:alpine
    container_name: gis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx/conf.d:/etc/nginx/conf.d:ro"
      - "./nginx/ssl:/etc/letsencrypt:ro"
      - "certbot-data:/var/www/certbot"
    depends_on:
      - frontend
      - backend
    networks:
      - gis-network

  certbot:
    image: certbot/certbot:latest
    container_name: gis-certbot
    restart: unless-stopped
    volumes:
      - "./nginx/ssl:/etc/letsencrypt:rw"
      - "certbot-data:/var/www/certbot"
    networks:
      - gis-network

volumes:
  pgdata:
  certbot-data:

networks:
  gis-network:
    driver: bridge
