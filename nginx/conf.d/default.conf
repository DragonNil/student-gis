# === HTTP → HTTPS Redirect ===
server {
    listen 80;
    server_name student-gis.ru www.student-gis.ru;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    return 301 https://$host$request_uri;
}

# === HTTPS Server ===
server {
    listen 443 ssl;
    http2 on;
    server_name student-gis.ru www.student-gis.ru;

    # 🔐 Пути к сертификатам (внутри контейнера!)
    ssl_certificate /etc/letsencrypt/live/student-gis.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/student-gis.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # === Проксирование на Frontend ===
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Проксирование API на Backend ===
    location /api {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
